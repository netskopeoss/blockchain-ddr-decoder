[project]
name = "blockchain-ddr-decoder"
version = "1.0.0"
description = "Blockchain dead-drop resolver (etherhiding) decoder toolkit - pull and decode C2 configs stored in smart contracts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Netskope OSS" }]
requires-python = ">=3.10"
keywords = ["deaddrop", "malware", "etherhiding", "blockchain", "c2", "threat-intel"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/netskope-oss/blockchain-ddr-decoder"
